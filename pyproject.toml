[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loredock"
version = "0.1.0"
description = "Reproducible local RAG, with source citations and human-reviewed evaluation"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Mehboob Ali"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[project.scripts]
loredock = "loredock.cli:main"

[tool.setuptools]
packages = ["loredock"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["loredock"]
