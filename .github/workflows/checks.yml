name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m loredock --help
      - name: Validate Compose
        run: LOREDOCK_STORAGE=/tmp/loredock-storage docker compose config --quiet
      # Live model evaluations are explicit local runs, never simulated by CI.
