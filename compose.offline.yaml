# The app has no external route. A fixed-target relay on two networks bridges
# only native Ollama, because Docker Desktop also blocks host access internally.
services:
  anythingllm:
    ports: !reset []
    volumes:
      - ./scripts/check-offline.cjs:/offline-check.cjs:ro
    environment:
      OLLAMA_BASE_PATH: http://ollama-relay:11434
    depends_on:
      ollama-relay:
        condition: service_healthy
  ollama-relay:
    image: mintplexlabs/anythingllm:1.18.0@sha256:5461782e7db41318a516925949a8f8366e258dd576411fca7961fe77dff054cc
    entrypoint: ["node", "/relay.cjs"]
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./scripts/ollama-relay.cjs:/relay.cjs:ro
    networks: [default, model_bridge]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:11434/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
networks:
  default:
    internal: true
  model_bridge: {}
